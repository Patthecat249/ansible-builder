---
version: 3

images:
  base_image:
    name: registry.access.redhat.com/ubi10/ubi:latest

dependencies:
  python_interpreter:
    package_system: python3
    python_path: /usr/bin/python3.12

  ansible_core:
    package_pip: ansible-core==2.21.6

  ansible_runner:
    package_pip: ansible-runner

  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

options:
  package_manager_path: /usr/bin/dnf
  user: '1000'
  workdir: /runner

additional_build_files:
  - src: files/ansible.cfg
    dest: configs

additional_build_steps:
  prepend_base:
    - RUN dnf update -y

  append_base:
    - RUN $PYCMD -m pip install --no-cache-dir --upgrade pip setuptools wheel

  prepend_galaxy:
    - COPY _build/configs/ansible.cfg /etc/ansible/ansible.cfg
    - ENV ANSIBLE_CONFIG=/etc/ansible/ansible.cfg
    - ARG ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN

  prepend_builder:
    - ENV PIP_IGNORE_INSTALLED=1

  prepend_final:
    - ENV PIP_IGNORE_INSTALLED=1

  append_final:
    - ENV PIP_IGNORE_INSTALLED=0
    - RUN dnf clean all
    - RUN rm -rf /var/cache/dnf
    - RUN $PYCMD -m pip show pip setuptools wheel
    - RUN $PYCMD -m pip check
